# Cantaloupe 5.x base configuration for local IIIF Image API 3 service.
# Runtime paths are supplied through environment variables; see IIIF_SETUP.md.
http.enabled = true
http.host = 0.0.0.0
http.port = 8182

endpoint.iiif.3.enabled = true

source.static = FilesystemSource
FilesystemSource.lookup_strategy = BasicLookupStrategy
FilesystemSource.BasicLookupStrategy.path_prefix =
FilesystemSource.BasicLookupStrategy.path_suffix =

cache.server.resolve_first = true
cache.server.derivative.enabled = true
cache.server.derivative = FilesystemCache
FilesystemCache.pathname =
